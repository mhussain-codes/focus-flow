<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151b">
  <title>Focus Flow — Make room for deep work</title>
  <style>
    :root{color-scheme:dark;--bg:#10151b;--panel:#171e26;--line:#27313c;--ink:#f2f4f6;--muted:#9aa7b3;--mint:#9de5ca;--blue:#9ec9ff;--radius:22px;font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#22343a 0,transparent 45%),var(--bg);color:var(--ink);display:grid;place-items:center;padding:28px 16px}
    button,input{font:inherit}button{cursor:pointer;color:inherit}.app{width:min(100%,520px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-size:18px;font-weight:750;letter-spacing:-.04em}.brand span{color:var(--mint)}.sessions{color:var(--muted);font-size:13px}.card{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 24px 70px #0005}
    .tabs{display:flex;gap:8px;padding:5px;background:#10151b;border-radius:14px}.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px;font-size:14px;font-weight:650}.tabs button[aria-pressed="true"]{background:#26323a;color:var(--ink)}
    .timer-wrap{display:grid;place-items:center;padding:28px 0 24px}.ring{width:min(72vw,278px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--mint) var(--progress,0%),#2a343d 0);padding:9px;transition:background .25s}.ring.break{background:conic-gradient(var(--blue) var(--progress,0%),#2a343d 0)}.ring-inner{width:100%;height:100%;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center}.time{font-variant-numeric:tabular-nums;font-size:clamp(56px,15vw,76px);font-weight:760;letter-spacing:-.075em;line-height:1}.mode-label{margin-top:10px;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
    .task{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:0 14px;margin:0 0 16px}.task-icon{color:var(--mint)}.task input{width:100%;background:none;border:0;outline:none;color:var(--ink);padding:13px 0}.task input::placeholder{color:#788692}.controls{display:flex;gap:10px}.controls button{border:1px solid var(--line);border-radius:13px;padding:12px 16px;background:#202a33;font-weight:700}.controls .primary{flex:1;background:var(--mint);color:#102019;border-color:transparent}.controls button:hover{filter:brightness(1.08)}button:focus-visible,input:focus-visible{outline:3px solid #fff9;outline-offset:3px}.hint{text-align:center;color:var(--muted);font-size:12px;margin:15px 0 0}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:390px){.card{padding:18px}.controls button{padding:11px 12px}}
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand"><span>✳</span> focus flow</div><div class="sessions" id="sessions">0 focus sessions</div></header>
    <section class="card" aria-label="Pomodoro timer">
      <div class="tabs" role="group" aria-label="Timer mode"><button type="button" data-mode="focus" aria-pressed="true">Focus</button><button type="button" data-mode="break" aria-pressed="false">Break</button></div>
      <div class="timer-wrap"><div class="ring" id="ring" style="--progress:0%"><div class="ring-inner"><div class="time" id="time" role="timer" aria-live="off">25:00</div><div class="mode-label" id="mode-label">time to focus</div></div></div></div>
      <label class="task"><span class="task-icon" aria-hidden="true">↳</span><input id="task" maxlength="80" placeholder="What are you focusing on?" aria-label="Current focus task"></label>
      <div class="controls"><button class="primary" id="start" type="button">Start focus</button><button id="reset" type="button" aria-label="Reset timer">Reset</button></div>
      <p class="hint">One thing at a time. You've got this.</p>
    </section>
    <div class="footer">Small steps add up ✨</div>
  </main>
  <script>
    const lengths={focus:1500,break:300};let mode='focus',remaining=lengths.focus,interval=null;
    const timeEl=document.querySelector('#time'),ring=document.querySelector('#ring'),label=document.querySelector('#mode-label'),startBtn=document.querySelector('#start'),task=document.querySelector('#task'),sessionsEl=document.querySelector('#sessions');
    let sessions=Number(localStorage.getItem('focus-flow-sessions')||0);sessionsEl.textContent=sessions+' focus '+(sessions===1?'session':'sessions');
    function render(){const mins=Math.floor(remaining/60),secs=remaining%60;timeEl.textContent=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');ring.style.setProperty('--progress',((1-remaining/lengths[mode])*100)+'%');ring.classList.toggle('break',mode==='break');label.textContent=mode==='focus'?'time to focus':'take a breather';startBtn.textContent=interval?'Pause':mode==='focus'?'Start focus':'Start break';document.title=timeEl.textContent+' · '+(mode==='focus'?'Focus Flow':'Break')}
    function stop(){if(interval){clearInterval(interval);interval=null}render()}
    function tick(){remaining=Math.max(0,remaining-1);render();if(remaining===0){stop();if(mode==='focus'){sessions++;localStorage.setItem('focus-flow-sessions',String(sessions));sessionsEl.textContent=sessions+' focus '+(sessions===1?'session':'sessions')}startBtn.textContent='Start again'}}
    function setMode(next){stop();mode=next;remaining=lengths[mode];render();document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)))}
    startBtn.addEventListener('click',()=>{if(interval){stop();return}if(remaining===0)remaining=lengths[mode];interval=setInterval(tick,1000);render()});
    document.querySelector('#reset').addEventListener('click',()=>{stop();remaining=lengths[mode];render()});
    document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
    task.value=localStorage.getItem('focus-flow-task')||'';task.addEventListener('input',()=>localStorage.setItem('focus-flow-task',task.value));render();
  </script>
</body>
</html>
